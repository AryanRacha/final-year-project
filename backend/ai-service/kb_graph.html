<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorless Knowledge Base — Interactive Call & Import Graph</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pill {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
        }
        #network {
            width: 100%;
            height: 720px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

            <span class="pill" style="background-color: #a855f7;">Class</span>
            <span class="pill" style="background-color: #ec4899;">React Component</span>
            <span class="pill" style="background-color: #06b6d4;">Import</span>

            edges: {

                font: { size: 11, align: 'middle', color: '#94a3b8' },
