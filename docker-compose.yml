services:
  neo4j:
    image: neo4j:5-community
    container_name: ai_service_neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/s3cureP@ssword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: ai_service_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
